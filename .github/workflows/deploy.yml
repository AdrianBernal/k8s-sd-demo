name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: write   # para hacer commit del manifiesto actualizado
  packages: write   # para publicar la imagen en GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (en minúsculas)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/echo-server"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Actualizar el manifiesto (GitOps)
        run: |
          sed -i "s#image: .*/echo-server:.*#image: ${IMAGE}:${TAG}#" k8s/deployment.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -am "deploy: echo-server ${TAG}"
          git push
